<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#F7F4ED"><title>Chapitre 11 — Mission</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="chapter-progress.css"><style>textarea{width:100%;box-sizing:border-box}</style><script src="profile.js"></script></head><body><main class="app"><a class="back-link" href="revision-11.html">← Révision</a><header><span class="chapter-badge">Chapitre 11 · 🎯</span><h1>Mission — Une journée pleine de nombres</h1></header><section class="card"><p>Imagine : tu prends la ligne 2, achètes deux cafés à 8 000 wons, retrouves trois personnes à 4 h 20. Écris les nombres en coréen et indique quel système tu utilises.</p><textarea id="free" rows="18"></textarea></section><button id="finish" style="width:100%">✅ Terminer le chapitre 11</button><button id="summary" style="display:none;width:100%">📚 Résumé</button></main><script src="chapter-progress.js"></script><script>const C="hanaKorean_chapter11_completed",F="hanaKorean_chapter11_missionFree";free.value=localStorage.getItem(F)||'';free.oninput=()=>localStorage.setItem(F,free.value);function r(){if(localStorage.getItem(C)==='completed'){finish.disabled=true;summary.style.display='block'}if(window.HanaChapterProgress)HanaChapterProgress.render()}finish.onclick=()=>{localStorage.setItem('hanaKorean_chapter11_use','completed');localStorage.setItem('hanaKorean_chapter11_mission','completed');localStorage.setItem(C,'completed');r()};summary.onclick=()=>location.href='resume-11.html';r();</script></body></html>
