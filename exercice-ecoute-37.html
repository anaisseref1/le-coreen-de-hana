<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F7F4ED">
  <title>Chapitre 37 — Exercice d'écoute</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="chapter-progress.css">
  <style>
    .quiz{padding:20px;margin-bottom:18px;background:var(--white);border-radius:var(--radius-large);box-shadow:var(--shadow)}
    .q{padding:14px;margin-top:12px;background:#FBFAF6;border-radius:var(--radius-medium)}
    .choices{display:flex;flex-direction:column;gap:8px;margin-top:10px}
    .choices button{width:100%;text-align:left;background:var(--soft-beige);color:var(--navy)}
    .feedback{margin-top:8px;font-size:14px}
  </style>
  <script src="profile.js"></script>
</head>
<body>
<main class="app">
<a class="back-link" href="ecoute-37.html">← Écoute</a>
<section id="hanaChapterPath" data-chapter-path></section>
<header>
  <span class="chapter-badge">Chapitre 37 · 🎧 Exercice</span>
  <h1>Comprendre une invitation</h1>
</header>

<section class="quiz">
  <div class="q" data-answer="b" data-audio="영화 볼래요?">
    <p><strong>1.</strong> 영화 볼래요?</p><button class="listen">🎧 Écouter</button>
    <div class="choices"><button data-choice="a">On a vu un film ?</button><button data-choice="b">Tu veux voir un film ?</button><button data-choice="c">Quel film as-tu vu ?</button></div><div class="feedback"></div>
  </div>

  <div class="q" data-answer="a" data-audio="몇 시에 만날까요?">
    <p><strong>2.</strong> 몇 시에 만날까요?</p><button class="listen">🎧 Écouter</button>
    <div class="choices"><button data-choice="a">À quelle heure on se retrouve ?</button><button data-choice="b">Quel jour on se retrouve ?</button><button data-choice="c">Où on se retrouve ?</button></div><div class="feedback"></div>
  </div>

  <div class="q" data-answer="c" data-audio="토요일 오후 어때요?">
    <p><strong>3.</strong> 토요일 오후 어때요?</p><button class="listen">🎧 Écouter</button>
    <div class="choices"><button data-choice="a">Tu travailles samedi après-midi ?</button><button data-choice="b">Tu préfères dimanche matin ?</button><button data-choice="c">Samedi après-midi, ça te va ?</button></div><div class="feedback"></div>
  </div>

  <div class="q" data-answer="b" data-audio="영화관 앞에서 만나요.">
    <p><strong>4.</strong> 영화관 앞에서 만나요.</p><button class="listen">🎧 Écouter</button>
    <div class="choices"><button data-choice="a">Entrons dans le cinéma.</button><button data-choice="b">Retrouvons-nous devant le cinéma.</button><button data-choice="c">Le cinéma est devant nous.</button></div><div class="feedback"></div>
  </div>

  <div class="q" data-answer="a" data-audio="미안해요. 토요일에는 약속이 있어요.">
    <p><strong>5.</strong> 미안해요. 토요일에는 약속이 있어요.</p><button class="listen">🎧 Écouter</button>
    <div class="choices"><button data-choice="a">Désolée, j'ai déjà quelque chose de prévu samedi.</button><button data-choice="b">Désolée, je suis libre samedi.</button><button data-choice="c">Samedi, retrouvons-nous.</button></div><div class="feedback"></div>
  </div>
</section>

<button id="nextButton" type="button" style="display:none;width:100%;">🗣️ Passer à l'oral</button>
</main>

<script src="chapter-progress.js"></script>
<script>
const LISTENING_KEY="hanaKorean_chapter37_listening";
const EXERCISE_KEY="hanaKorean_chapter37_listeningExercise";
const nextButton=document.getElementById("nextButton");

function guard(){
  if(localStorage.getItem(LISTENING_KEY)!=="completed"){
    window.location.href="ecoute-37.html";
    return false;
  }
  return true;
}
if(!guard())throw new Error("chapter37-listening-exercise-guard");

function speak(text){
  if(!("speechSynthesis" in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang="ko-KR";u.rate=.82;
  const voices=speechSynthesis.getVoices();
  const v=voices.find(x=>x.lang==="ko-KR")||voices.find(x=>x.lang&&x.lang.startsWith("ko"));
  if(v)u.voice=v;
  speechSynthesis.speak(u);
}

const qs=[...document.querySelectorAll(".q")];
qs.forEach(q=>{
  q.querySelector(".listen").addEventListener("click",()=>speak(q.dataset.audio));
  q.querySelectorAll("[data-choice]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      if(q.dataset.done==="true")return;
      const fb=q.querySelector(".feedback");
      if(btn.dataset.choice===q.dataset.answer){
        q.dataset.done="true";
        fb.textContent="✅ Très bien !";
        q.querySelectorAll("[data-choice]").forEach(b=>b.disabled=true);
        if(qs.every(x=>x.dataset.done==="true")){
          localStorage.setItem(EXERCISE_KEY,"completed");
          nextButton.style.display="block";
          if(window.HanaChapterProgress)HanaChapterProgress.render();
        }
      }else{
        btn.disabled=true;
        fb.textContent="💙 Réécoute et repère la proposition, l'heure ou le lieu.";
      }
    });
  });
});

if(localStorage.getItem(EXERCISE_KEY)==="completed"){
  qs.forEach(q=>q.querySelectorAll("[data-choice]").forEach(b=>b.disabled=true));
  nextButton.style.display="block";
}
nextButton.addEventListener("click",()=>window.location.href="parle-37.html");
if(window.HanaChapterProgress)HanaChapterProgress.render();
</script>
</body>
</html>
