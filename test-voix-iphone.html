<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagnostic voix iPhone — Le Coréen de Hana</title><style>body{font:16px -apple-system,BlinkMacSystemFont,Arial,sans-serif;background:#f7f4ed;color:#203449;max-width:650px;margin:auto;padding:22px}button{display:block;width:100%;padding:15px;margin:12px 0;border:0;border-radius:12px;background:#357f75;color:white;font-size:16px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:15px;border-radius:12px;line-height:1.5}small{color:#475569}</style></head><body><h1>🎧 Test des voix sur iPhone</h1><p>Ouvre cette page dans Safari, monte le volume, puis appuie sur les boutons un par un. Les résultats s'afficheront plus bas.</p><button onclick="test('Bonjour, ceci est un test de voix française.','fr-FR',false)">1. Tester une voix française 🇫🇷</button><button onclick="test('안녕하세요. 저는 아나예요.','ko-KR',false)">2. Tester le coréen sans voix imposée 🇰🇷</button><button onclick="test('안녕하세요. 저는 아나예요.','ko-KR',true)">3. Tester une voix coréenne détectée 🇰🇷</button><button onclick="showVoices()">4. Afficher les voix disponibles</button><button onclick="reset()" style="background:#65717a">Effacer les résultats</button><h2>Résultats</h2><pre id="log" aria-live="polite">Aucun test effectué.</pre><small>Ne partage pas de données personnelles : cette page fonctionne uniquement sur ton appareil.</small><script>let current=null,timer=null;const synth=window.speechSynthesis;let lines=[];function say(s){lines.push(new Date().toLocaleTimeString('fr-FR')+' — '+s);document.getElementById('log').textContent=lines.join('\n');}function reset(){lines=[];document.getElementById('log').textContent='Aucun test effectué.';}function showVoices(){if(!synth){say('speechSynthesis indisponible');return;}const vs=synth.getVoices();say('Nombre de voix : '+vs.length);if(!vs.length)say('Aucune voix répertoriée.');vs.forEach(v=>say('• '+v.name+' / '+v.lang+(v.default?' (défaut)':'')));}function test(txt,lang,forced){if(!synth||!window.SpeechSynthesisUtterance){say('API de synthèse vocale non disponible');return;}clearTimeout(timer);synth.cancel();const voices=synth.getVoices(), ko=voices.find(v=>v.lang.toLowerCase().startsWith('ko'));const u=new SpeechSynthesisUtterance(txt);u.lang=lang;u.rate=0.9;u.volume=1;u.pitch=1;if(forced){if(!ko){say('Aucune voix coréenne exposée par Safari : test effectué sans voix imposée.');}else{u.voice=ko;say('Voix coréenne choisie : '+ko.name+' / '+ko.lang);}}current=u;say('Demande de lecture '+lang+' (voix imposée : '+(forced&&!!ko?'oui':'non')+')');u.onstart=()=>say('Événement : démarrage de la lecture');u.onend=()=>{say('Événement : fin de lecture');clearTimeout(timer);};u.onerror=e=>{say('ERREUR : '+e.error);clearTimeout(timer);};try{synth.speak(u);if(synth.paused)synth.resume();timer=setTimeout(()=>{if(current===u)say('Après 5 s : speaking='+synth.speaking+', pending='+synth.pending+', paused='+synth.paused+' (aucun événement supplémentaire ne garantit pas une panne)');},5000);}catch(e){say('Exception : '+e.name+' — '+e.message);}}if(synth&&'onvoiceschanged'in synth)synth.addEventListener('voiceschanged',()=>say('Liste des voix mise à jour : '+synth.getVoices().length));</script></body></html>
