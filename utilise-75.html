<style>textarea{width:100%;box-sizing:border-box}</style><script src="profile.js"></script></head><body><main class="app"><a class="back-link" href="revision-75.html">← Révision</a><header><span class="chapter-badge">Chapitre 75 · 🏆</span><h1>10 minutes en coréen</h1></header><section class="card"><p>Choisis plusieurs thèmes et parle pendant 10 minutes.</p><p>Règle : ne recommence pas depuis le début à cause d’une erreur.</p><textarea id="free" rows="16" placeholder="Notes après la mission…"></textarea></section><button id="finish" style="width:100%">🏆 Terminer le chapitre 75</button><button id="summary" style="display:none;width:100%">🏆 Résumé & Badge 7</button></main><script src="chapter-progress.js"></script><script>const C="hanaKorean_chapter75_completed",B="hanaKorean_badge7_unlocked",F="hanaKorean_chapter75_missionFree";free.value=localStorage.getItem(F)||"";free.oninput=()=>localStorage.setItem(F,free.value);function r(){if(localStorage.getItem(C)==="completed"){finish.disabled=true;summary.style.display="block"}if(window.HanaChapterProgress)HanaChapterProgress.render()}finish.onclick=()=>{["use","mission"].forEach(s=>localStorage.setItem("hanaKorean_chapter75_"+s,"completed"));localStorage.setItem(C,"completed");localStorage.setItem(B,"true");r()};summary.onclick=()=>location.href="resume-75.html";r();</script></body></html>
