<!DOCTYPE html><html lang="fr"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#F7F4ED"><title>Chapitre 54 — Écoute</title>
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="chapter-progress.css">
<style>.hidden-text{display:none}.listen-box{padding:14px;margin:10px 0;background:#FBFAF6;border-radius:var(--radius-medium)}</style><script src="profile.js"></script></head>
<body><main class="app">
<a class="back-link" href="chapitre-54.html">← Chapitre 54</a><section id="hanaChapterPath" data-chapter-path></section>
<header><span class="chapter-badge">Chapitre 54 · 🎧</span><h1>Écouter avant de lire</h1></header>
<section class="card">
<p>Écoute deux fois avant d’afficher le texte.</p>
<button id="play" style="width:100%">🎧 Écouter</button>
<button id="show" style="width:100%;margin-top:8px">📜 Afficher le texte</button>
<div id="text" class="hidden-text listen-box">
<p>오늘 친구하고 카페에 가요.</p>
<p>어제 집에서 영화를 봤어요.</p>
<p>내일 민수 씨를 만날 거예요.</p>
</div>
</section>
<button id="done" style="width:100%">✅ J'ai écouté</button><button id="next" style="display:none;width:100%">🧠 Exercice d'écoute</button>
</main>
<script src="chapter-progress.js"></script><script>
const P="hanaKorean_chapter54_understanding",K="hanaKorean_chapter54_listening",d=document.getElementById("done"),n=document.getElementById("next");
if(localStorage.getItem(P)!=="completed")location.href="chapitre-54.html";
function speak(t){if(!("speechSynthesis"in window))return;const u=new SpeechSynthesisUtterance(HanaProfile.replacePerson(t));u.lang="ko-KR";u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}
document.getElementById("play").onclick=()=>speak("오늘 친구하고 카페에 가요. 어제 집에서 영화를 봤어요. 내일 민수 씨를 만날 거예요.");
document.getElementById("show").onclick=()=>document.getElementById("text").classList.toggle("hidden-text");
function r(){if(localStorage.getItem(K)==="completed"){d.disabled=true;n.style.display="block"}if(window.HanaChapterProgress)HanaChapterProgress.render()}
d.onclick=()=>{localStorage.setItem(K,"completed");r()};n.onclick=()=>location.href="exercice-ecoute-55.html";r();
</script></body></html>
