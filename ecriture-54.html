<!DOCTYPE html><html lang="fr"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#F7F4ED"><title>Chapitre 54 — Carnet d’écoute</title>
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="chapter-progress.css">
<style>textarea{width:100%;box-sizing:border-box}</style><script src="profile.js"></script></head>
<body><main class="app">
<a class="back-link" href="parle-54.html">← Retour</a><section id="hanaChapterPath" data-chapter-path></section>
<header><span class="chapter-badge">Chapitre 54 · 📓</span><h1>Mon carnet d’écoute</h1></header>
<section class="card">
<p>🟢 J’ai compris facilement :</p><textarea id="green" rows="3"></textarea>
<p>🟡 Je connaissais mais je n’ai pas reconnu :</p><textarea id="yellow" rows="3"></textarea>
<p>🔴 Nouveau pour moi :</p><textarea id="red" rows="3"></textarea>
<p>⭐ Phrase que je reconnais maintenant immédiatement :</p><textarea id="star" rows="3"></textarea>
</section>
<button id="done" style="width:100%">✅ Terminé</button><button id="next" style="display:none;width:100%">🧠 Révision</button>
</main>
<script src="chapter-progress.js"></script><script>
const K="hanaKorean_chapter54_writing",F="hanaKorean_chapter54_listeningNotebook",d=document.getElementById("done"),n=document.getElementById("next"),ids=["green","yellow","red","star"];
let saved={};try{saved=JSON.parse(localStorage.getItem(F)||"{}")}catch(e){}
ids.forEach(id=>{const el=document.getElementById(id);el.value=saved[id]||"";el.oninput=()=>{const x={};ids.forEach(k=>x[k]=document.getElementById(k).value);localStorage.setItem(F,JSON.stringify(x))}});
function r(){if(localStorage.getItem(K)==="completed"){d.disabled=true;n.style.display="block"}if(window.HanaChapterProgress)HanaChapterProgress.render()}
d.onclick=()=>{localStorage.setItem(K,"completed");r()};n.onclick=()=>location.href="revision-54.html";r();
</script></body></html>
