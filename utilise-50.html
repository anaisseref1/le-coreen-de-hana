const USE="hanaKorean_chapter50_use",MIS="hanaKorean_chapter50_mission",COMP="hanaKorean_chapter50_completed",F="hanaKorean_chapter50_missionFreeAnswer",f=document.getElementById("free"),b=document.getElementById("finish"),s=document.getElementById("summary");f.value=localStorage.getItem(F)||"";f.oninput=()=>localStorage.setItem(F,f.value);function r(){if(localStorage.getItem(USE)==="completed"||localStorage.getItem(COMP)==="completed"){b.disabled=true;b.textContent="✅ Chapitre 50 terminé";s.style.display="block"}if(window.HanaChapterProgress)HanaChapterProgress.render()}b.onclick=()=>{localStorage.setItem(F,f.value);localStorage.setItem(USE,"completed");localStorage.setItem(MIS,"completed");localStorage.setItem(COMP,"completed");r()};s.onclick=()=>location.href="resume-50.html";r();
</script></body></html>
