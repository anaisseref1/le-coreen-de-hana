const P="hanaKorean_chapter48_understanding",K="hanaKorean_chapter48_listening";if(localStorage.getItem(P)!=="completed")location.href="chapitre-48.html";
function speak(t){if(!("speechSynthesis"in window))return;const u=new SpeechSynthesisUtterance(HanaProfile.replacePerson(t));u.lang="ko-KR";u.rate=.82;speechSynthesis.cancel();speechSynthesis.speak(u)}
document.getElementById("listen").onclick=()=>speak("문제가 있어요. 와이파이가 안 돼요. 에어컨이 작동하지 않아요. 뜨거운 물이 잘 안 나와요. 문이 안 열려요. 너무 시끄러워요.");
const d=document.getElementById("done"),n=document.getElementById("next");function r(){if(localStorage.getItem(K)==="completed"){d.disabled=true;n.style.display="block"}if(window.HanaChapterProgress)HanaChapterProgress.render()}
d.onclick=()=>{localStorage.setItem(K,"completed");r()};n.onclick=()=>location.href="exercice-ecoute-49.html";r();
</script></body></html>
