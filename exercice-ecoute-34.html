<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F7F4ED">
  <title>Chapitre 34 — Exercice d'écoute</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="chapter-progress.css">
  <style>
    .quiz{padding:20px;margin-bottom:18px;background:var(--white);border-radius:var(--radius-large);box-shadow:var(--shadow)}
    .q{padding:14px;margin-top:12px;background:#FBFAF6;border-radius:var(--radius-medium)}
    .choices{display:flex;flex-direction:column;gap:8px;margin-top:10px}
    .choices button{width:100%;text-align:left;background:var(--soft-beige);color:var(--navy)}
    .feedback{margin-top:8px;font-size:14px}
  </style>
  <script src="profile.js"></script>
</head>
<body>
<main class="app">
<a class="back-link" href="ecoute-34.html">← Écoute</a>
<section id="hanaChapterPath" data-chapter-path></section>
<header>
  <span class="chapter-badge">Chapitre 34 · 🎧 Exercice</span>
  <h1>Comprendre une raison</h1>
</header>

<section class="quiz">
  <div class="q" data-answer="b" data-audio="왜 한국을 좋아해요?">
    <p><strong>1.</strong> 왜 한국을 좋아해요?</p><button class="listen">🎧 Écouter</button>
    <div class="choices"><button data-choice="a">Quand vas-tu en Corée ?</button><button data-choice="b">Pourquoi aimes-tu la Corée ?</button><button data-choice="c">Que fais-tu en Corée ?</button></div><div class="feedback"></div>
  </div>

  <div class="q" data-answer="a" data-audio="풍경이 아름다워서 좋아해요.">
    <p><strong>2.</strong> 풍경이 아름다워서 좋아해요.</p><button class="listen">🎧 Écouter</button>
    <div class="choices"><button data-choice="a">J'aime parce que les paysages sont magnifiques.</button><button data-choice="b">Je pense que les paysages sont difficiles.</button><button data-choice="c">Je vais voir les paysages demain.</button></div><div class="feedback"></div>
  </div>

  <div class="q" data-answer="c" data-audio="서울에 있으면 마음이 편해요. 그래서 한국을 좋아해요.">
    <p><strong>3.</strong> 서울에 있으면 마음이 편해요. 그래서 한국을 좋아해요.</p><button class="listen">🎧 Écouter</button>
    <div class="choices"><button data-choice="a">Séoul est loin, donc je n'aime pas la Corée.</button><button data-choice="b">Je préfère Paris à Séoul.</button><button data-choice="c">Je me sens bien à Séoul, c'est pourquoi j'aime la Corée.</button></div><div class="feedback"></div>
  </div>

  <div class="q" data-answer="b" data-audio="한국 사람들과 이야기하고 싶어서 공부해요.">
    <p><strong>4.</strong> 한국 사람들과 이야기하고 싶어서 공부해요.</p><button class="listen">🎧 Écouter</button>
    <div class="choices"><button data-choice="a">J'étudie avant de parler avec des Coréens.</button><button data-choice="b">J'étudie parce que je veux parler avec des Coréens.</button><button data-choice="c">Je parle coréen parce que j'étudie.</button></div><div class="feedback"></div>
  </div>

  <div class="q" data-answer="a" data-audio="네, 조금 그리워요.">
    <p><strong>5.</strong> 네, 조금 그리워요.</p><button class="listen">🎧 Écouter</button>
    <div class="choices"><button data-choice="a">Oui, ça me manque un peu.</button><button data-choice="b">Oui, c'est un peu loin.</button><button data-choice="c">Oui, c'est très joli.</button></div><div class="feedback"></div>
  </div>
</section>

<button id="nextButton" type="button" style="display:none;width:100%;">🗣️ Passer à l'oral</button>
</main>
<script src="chapter-progress.js"></script>
<script>
const LISTENING_KEY="hanaKorean_chapter34_listening";
const EXERCISE_KEY="hanaKorean_chapter34_listeningExercise";
const nextButton=document.getElementById("nextButton");

function guard(){
  if(localStorage.getItem(LISTENING_KEY)!=="completed"){
    window.location.href="ecoute-34.html";
    return false;
  }
  return true;
}
if(!guard())throw new Error("chapter34-listening-exercise-guard");

function speak(text){
  if(!("speechSynthesis" in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang="ko-KR";u.rate=.82;
  const voices=speechSynthesis.getVoices();
  const v=voices.find(x=>x.lang==="ko-KR")||voices.find(x=>x.lang&&x.lang.startsWith("ko"));
  if(v)u.voice=v;
  speechSynthesis.speak(u);
}
const qs=[...document.querySelectorAll(".q")];
qs.forEach(q=>{
  q.querySelector(".listen").addEventListener("click",()=>speak(q.dataset.audio));
  q.querySelectorAll("[data-choice]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      if(q.dataset.done==="true")return;
      const fb=q.querySelector(".feedback");
      if(btn.dataset.choice===q.dataset.answer){
        q.dataset.done="true";
        fb.textContent="✅ Très bien !";
        q.querySelectorAll("[data-choice]").forEach(b=>b.disabled=true);
        if(qs.every(x=>x.dataset.done==="true")){
          localStorage.setItem(EXERCISE_KEY,"completed");
          nextButton.style.display="block";
          if(window.HanaChapterProgress)HanaChapterProgress.render();
        }
      }else{
        btn.disabled=true;
        fb.textContent="💙 Réécoute et cherche la relation cause → conséquence.";
      }
    });
  });
});
if(localStorage.getItem(EXERCISE_KEY)==="completed"){
  qs.forEach(q=>q.querySelectorAll("[data-choice]").forEach(b=>b.disabled=true));
  nextButton.style.display="block";
}
nextButton.addEventListener("click",()=>window.location.href="parle-34.html");
if(window.HanaChapterProgress)HanaChapterProgress.render();
</script>
</body>
</html>
