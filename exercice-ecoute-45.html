<!DOCTYPE html><html lang="fr"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#F7F4ED">
<title>Chapitre 45 — Exercice d’écoute</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="chapter-progress.css">
<style>.q{padding:14px;margin:12px 0;background:#FBFAF6;border-radius:var(--radius-medium)}.q button{width:100%;margin-top:7px;text-align:left;background:var(--soft-beige);color:var(--navy)}</style>
<script src="profile.js"></script>
</head><body><main class="app">
<a class="back-link" href="ecoute-45.html">← Écoute</a>
<section id="hanaChapterPath" data-chapter-path></section>
<header><span class="chapter-badge">Chapitre 45 · 🎧 Exercice</span><h1>Je reconnais -(으)ㄹ 수 있어요</h1></header>
<section class="card">
<div class="q" data-answer="a"><p><strong>1.</strong> 갈 수 있어요</p><button data-choice="a">Je peux y aller</button><button data-choice="b">Je dois y aller</button><div class="f"></div></div>
<div class="q" data-answer="b"><p><strong>2.</strong> 먹을 수 없어요</p><button data-choice="a">Je ne veux pas manger</button><button data-choice="b">Je ne peux pas manger</button><div class="f"></div></div>
<div class="q" data-answer="b"><p><strong>3.</strong> 살다 → ?</p><button data-choice="a">살을 수 있어요</button><button data-choice="b">살 수 있어요</button><div class="f"></div></div>
<div class="q" data-answer="a"><p><strong>4.</strong> 요리할 수 있어요?</p><button data-choice="a">Tu sais cuisiner ?</button><button data-choice="b">Tu veux cuisiner ?</button><div class="f"></div></div>
<div class="q" data-answer="b"><p><strong>5.</strong> 아직 빨리 말할 수 없어요</p><button data-choice="a">Je parle très vite</button><button data-choice="b">Je ne peux pas encore parler vite</button><div class="f"></div></div>
</section>
<button id="next" style="display:none;width:100%">🗣️ Passer à l'oral</button>
</main>
<script src="chapter-progress.js"></script>
<script>
const P="hanaKorean_chapter45_listening",K="hanaKorean_chapter45_listeningExercise";
if(localStorage.getItem(P)!=="completed")location.href="ecoute-45.html";
const qs=[...document.querySelectorAll(".q")],n=document.getElementById("next");
qs.forEach(q=>q.querySelectorAll("button").forEach(b=>b.onclick=()=>{if(q.dataset.done==="true")return;if(b.dataset.choice===q.dataset.answer){q.dataset.done="true";q.querySelector(".f").textContent="✅ Très bien !";q.querySelectorAll("button").forEach(x=>x.disabled=true);if(qs.every(x=>x.dataset.done==="true")){localStorage.setItem(K,"completed");n.style.display="block";if(window.HanaChapterProgress)HanaChapterProgress.render()}}else{b.disabled=true;q.querySelector(".f").textContent="💙 Essaie encore."}}));
if(localStorage.getItem(K)==="completed")n.style.display="block";
n.onclick=()=>location.href="parle-45.html";
if(window.HanaChapterProgress)HanaChapterProgress.render();
</script>
</body></html>
