<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F7F4ED">
  <title>Chapitre 32 — Exercice d'écoute</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="chapter-progress.css">
  <style>
    .quiz-card{padding:20px;margin-bottom:18px;background:var(--white);border-radius:var(--radius-large);box-shadow:var(--shadow);}
    .question{padding:15px;margin-top:12px;background:#FBFAF6;border-radius:var(--radius-medium);line-height:1.6;}
    .choices{display:flex;flex-direction:column;gap:9px;margin-top:10px;}
    .choice-button{width:100%;padding:13px 14px;background:var(--soft-beige);color:var(--navy);text-align:left;}
    .choice-button.correct{background:var(--success-light);color:var(--success);font-weight:bold;}
    .choice-button.wrong{background:var(--error-light);color:var(--error);font-weight:bold;}
    .feedback{display:none;margin-top:10px;padding:10px 12px;border-radius:var(--radius-medium);}
    .feedback.show{display:block;background:var(--soft-green);}
  </style>
  <script src="profile.js"></script>
</head>
<body>
<main class="app">
<a class="back-link" href="ecoute-32.html">← Écoute</a>
<section id="hanaChapterPath" data-chapter-path></section>

<header>
  <span class="chapter-badge">Chapitre 32 · 🎧 Exercice</span>
  <p class="korean">잘 들어 보세요 🌸</p>
  <h1>Comprendre les habitudes</h1>
  <p>Écoute chaque phrase puis choisis le bon sens.</p>
</header>

<section class="quiz-card">
  <div class="question" data-answer="b" data-audio="매일 한국어를 공부해요.">
    <p><strong>1.</strong> 🔊 매일 한국어를 공부해요.</p>
    <button class="listen" type="button">🎧 Écouter</button>
    <div class="choices">
      <button class="choice-button" data-choice="a">J'étudie parfois le coréen.</button>
      <button class="choice-button" data-choice="b">J'étudie le coréen tous les jours.</button>
      <button class="choice-button" data-choice="c">Je n'étudie jamais le coréen.</button>
    </div>
    <div class="feedback"></div>
  </div>

  <div class="question" data-answer="c" data-audio="커피를 자주 마셔요.">
    <p><strong>2.</strong> 🔊 커피를 자주 마셔요.</p>
    <button class="listen" type="button">🎧 Écouter</button>
    <div class="choices">
      <button class="choice-button" data-choice="a">Je bois toujours du café.</button>
      <button class="choice-button" data-choice="b">Je ne bois presque jamais de café.</button>
      <button class="choice-button" data-choice="c">Je bois souvent du café.</button>
    </div>
    <div class="feedback"></div>
  </div>

  <div class="question" data-answer="a" data-audio="가끔 운동해요.">
    <p><strong>3.</strong> 🔊 가끔 운동해요.</p>
    <button class="listen" type="button">🎧 Écouter</button>
    <div class="choices">
      <button class="choice-button" data-choice="a">Je fais parfois du sport.</button>
      <button class="choice-button" data-choice="b">Je fais toujours du sport.</button>
      <button class="choice-button" data-choice="c">Je fais du sport tous les jours.</button>
    </div>
    <div class="feedback"></div>
  </div>

  <div class="question" data-answer="b" data-audio="주말에는 보통 집에서 쉬어요.">
    <p><strong>4.</strong> 🔊 주말에는 보통 집에서 쉬어요.</p>
    <button class="listen" type="button">🎧 Écouter</button>
    <div class="choices">
      <button class="choice-button" data-choice="a">Le week-end, je travaille généralement.</button>
      <button class="choice-button" data-choice="b">Le week-end, je me repose généralement à la maison.</button>
      <button class="choice-button" data-choice="c">Le week-end, je rencontre toujours des amis.</button>
    </div>
    <div class="feedback"></div>
  </div>

  <div class="question" data-answer="c" data-audio="커피를 전혀 안 마셔요.">
    <p><strong>5.</strong> 🔊 커피를 전혀 안 마셔요.</p>
    <button class="listen" type="button">🎧 Écouter</button>
    <div class="choices">
      <button class="choice-button" data-choice="a">Je bois presque tous les jours du café.</button>
      <button class="choice-button" data-choice="b">Je bois parfois du café.</button>
      <button class="choice-button" data-choice="c">Je ne bois jamais / pas du tout de café.</button>
    </div>
    <div class="feedback"></div>
  </div>
</section>

<button id="nextButton" type="button" style="display:none;width:100%;">🗣️ Passer à l'oral</button>
</main>

<script src="chapter-progress.js"></script>
<script>
const LISTENING_KEY="hanaKorean_chapter32_listening";
const LISTENING_EXERCISE_KEY="hanaKorean_chapter32_listeningExercise";
const nextButton=document.getElementById("nextButton");

function guard(){
  if(localStorage.getItem(LISTENING_KEY)!=="completed"){
    window.location.href="ecoute-32.html";
    return false;
  }
  return true;
}
if(!guard()) throw new Error("chapter32-listening-exercise-guard");

function speak(text){
  if(!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang="ko-KR";
  u.rate=.82;
  const voices=speechSynthesis.getVoices();
  const v=voices.find(x=>x.lang==="ko-KR")||voices.find(x=>x.lang&&x.lang.startsWith("ko"));
  if(v)u.voice=v;
  speechSynthesis.speak(u);
}

const questions=[...document.querySelectorAll(".question")];
questions.forEach(q=>{
  q.querySelector(".listen").addEventListener("click",()=>speak(q.dataset.audio));
  q.querySelectorAll(".choice-button").forEach(btn=>{
    btn.addEventListener("click",()=>{
      if(q.dataset.done==="true") return;
      const fb=q.querySelector(".feedback");
      if(btn.dataset.choice===q.dataset.answer){
        q.dataset.done="true";
        btn.classList.add("correct");
        q.querySelectorAll(".choice-button").forEach(x=>x.disabled=true);
        fb.textContent="✅ Très bien !";
        fb.classList.add("show");
        if(questions.every(x=>x.dataset.done==="true")){
          localStorage.setItem(LISTENING_EXERCISE_KEY,"completed");
          nextButton.style.display="block";
          if(window.HanaChapterProgress)HanaChapterProgress.render();
        }
      }else{
        btn.classList.add("wrong");
        btn.disabled=true;
        fb.textContent="Pas encore 💙 Réécoute le mot de fréquence.";
        fb.classList.add("show");
      }
    });
  });
});

if(localStorage.getItem(LISTENING_EXERCISE_KEY)==="completed"){
  questions.forEach(q=>{
    q.dataset.done="true";
    q.querySelectorAll(".choice-button").forEach(x=>x.disabled=true);
  });
  nextButton.style.display="block";
}
nextButton.addEventListener("click",()=>window.location.href="parle-32.html");
if(window.HanaChapterProgress)HanaChapterProgress.render();
</script>
</body>
</html>
