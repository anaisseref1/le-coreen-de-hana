<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F7F4ED">
  <title>Chapitre 32 — Exercice d'écoute</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="chapter-progress.css">
  <style>
    .quiz{padding:20px;margin-bottom:18px;background:var(--white);border-radius:var(--radius-large);box-shadow:var(--shadow)}
    .q{padding:14px;margin-top:12px;background:#FBFAF6;border-radius:var(--radius-medium)}
    .choices{display:flex;flex-direction:column;gap:8px;margin-top:10px}
    .choices button{width:100%;text-align:left;background:var(--soft-beige);color:var(--navy)}
    .feedback{margin-top:8px;font-size:14px}
  </style>
  <script src="profile.js"></script>
</head>
<body>
<main class="app">
<a class="back-link" href="ecoute-32.html">← Écoute</a>
<section id="hanaChapterPath" data-chapter-path></section>
<header>
  <span class="chapter-badge">Chapitre 32 · 🎧 Exercice</span>
  <h1>Comprendre une opinion</h1>
  <p>Écoute puis choisis le sens correct.</p>
</header>

<section class="quiz">
  <div class="q" data-answer="b" data-audio="이 영화 어떻게 생각해요?">
    <p><strong>1.</strong> 이 영화 어떻게 생각해요?</p><button class="listen">🎧 Écouter</button>
    <div class="choices"><button data-choice="a">Quel film veux-tu voir ?</button><button data-choice="b">Que penses-tu de ce film ?</button><button data-choice="c">Où est le cinéma ?</button></div><div class="feedback"></div>
  </div>
  <div class="q" data-answer="a" data-audio="재미있다고 생각해요.">
    <p><strong>2.</strong> 재미있다고 생각해요.</p><button class="listen">🎧 Écouter</button>
    <div class="choices"><button data-choice="a">Je pense que c'est intéressant.</button><button data-choice="b">Je pense que c'est difficile.</button><button data-choice="c">Je ne trouve pas ça intéressant.</button></div><div class="feedback"></div>
  </div>
  <div class="q" data-answer="c" data-audio="조금 어려워요. 하지만 재미있어요.">
    <p><strong>3.</strong> 조금 어려워요. 하지만 재미있어요.</p><button class="listen">🎧 Écouter</button>
    <div class="choices"><button data-choice="a">C'est très facile et amusant.</button><button data-choice="b">C'est difficile et ennuyeux.</button><button data-choice="c">C'est un peu difficile, mais intéressant.</button></div><div class="feedback"></div>
  </div>
  <div class="q" data-answer="b" data-audio="맞아요. 저도 그렇게 생각해요.">
    <p><strong>4.</strong> 맞아요. 저도 그렇게 생각해요.</p><button class="listen">🎧 Écouter</button>
    <div class="choices"><button data-choice="a">Je ne suis pas du tout d'accord.</button><button data-choice="b">Exactement. Moi aussi, je pense comme ça.</button><button data-choice="c">Je ne sais pas quoi penser.</button></div><div class="feedback"></div>
  </div>
  <div class="q" data-answer="a" data-audio="저는 조금 다르게 생각해요.">
    <p><strong>5.</strong> 저는 조금 다르게 생각해요.</p><button class="listen">🎧 Écouter</button>
    <div class="choices"><button data-choice="a">Moi, je pense un peu différemment.</button><button data-choice="b">Moi aussi, je pense pareil.</button><button data-choice="c">Je trouve cela très joli.</button></div><div class="feedback"></div>
  </div>
</section>

<button id="nextButton" type="button" style="display:none;width:100%;">🗣️ Passer à l'oral</button>
</main>
<script src="chapter-progress.js"></script>
<script>
const LISTENING_KEY="hanaKorean_chapter32_listening";
const EXERCISE_KEY="hanaKorean_chapter32_listeningExercise";
const nextButton=document.getElementById("nextButton");
function guard(){if(localStorage.getItem(LISTENING_KEY)!=="completed"){window.location.href="ecoute-32.html";return false;}return true;}
if(!guard())throw new Error("chapter32-listening-exercise-guard");

function speak(text){if(!("speechSynthesis" in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="ko-KR";u.rate=.82;const v=speechSynthesis.getVoices().find(x=>x.lang==="ko-KR")||speechSynthesis.getVoices().find(x=>x.lang&&x.lang.startsWith("ko"));if(v)u.voice=v;speechSynthesis.speak(u);}
const qs=[...document.querySelectorAll(".q")];
qs.forEach(q=>{
  q.querySelector(".listen").addEventListener("click",()=>speak(q.dataset.audio));
  q.querySelectorAll("[data-choice]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      if(q.dataset.done==="true")return;
      const fb=q.querySelector(".feedback");
      if(btn.dataset.choice===q.dataset.answer){
        q.dataset.done="true";fb.textContent="✅ Très bien !";
        q.querySelectorAll("[data-choice]").forEach(b=>b.disabled=true);
        if(qs.every(x=>x.dataset.done==="true")){
          localStorage.setItem(EXERCISE_KEY,"completed");
          nextButton.style.display="block";
          if(window.HanaChapterProgress)HanaChapterProgress.render();
        }
      }else{
        btn.disabled=true;fb.textContent="💙 Réécoute la phrase et repère le mot-clé.";
      }
    });
  });
});
if(localStorage.getItem(EXERCISE_KEY)==="completed"){
  qs.forEach(q=>q.querySelectorAll("[data-choice]").forEach(b=>b.disabled=true));
  nextButton.style.display="block";
}
nextButton.addEventListener("click",()=>window.location.href="parle-32.html");
if(window.HanaChapterProgress)HanaChapterProgress.render();
</script>
</body>
</html>
