<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F7F4ED">
  <title>Chapitre 36 — Exercice d'écoute</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="chapter-progress.css">
  <style>
    .quiz{padding:20px;margin-bottom:18px;background:var(--white);border-radius:var(--radius-large);box-shadow:var(--shadow)}
    .q{padding:14px;margin-top:12px;background:#FBFAF6;border-radius:var(--radius-medium)}
    .choices{display:flex;flex-direction:column;gap:8px;margin-top:10px}
    .choices button{width:100%;text-align:left;background:var(--soft-beige);color:var(--navy)}
    .feedback{margin-top:8px;font-size:14px}
  </style>
  <script src="profile.js"></script>
</head>
<body>
<main class="app">
<a class="back-link" href="ecoute-36.html">← Écoute</a>
<section id="hanaChapterPath" data-chapter-path></section>
<header>
  <span class="chapter-badge">Chapitre 36 · 🎧 Exercice</span>
  <h1>Comprendre une émotion</h1>
</header>

<section class="quiz">
  <div class="q" data-answer="b" data-audio="요즘 기분이 어때요?">
    <p><strong>1.</strong> 요즘 기분이 어때요?</p><button class="listen">🎧 Écouter</button>
    <div class="choices"><button data-choice="a">Que fais-tu ces temps-ci ?</button><button data-choice="b">Comment te sens-tu ces temps-ci ?</button><button data-choice="c">Où vas-tu aujourd'hui ?</button></div><div class="feedback"></div>
  </div>

  <div class="q" data-answer="a" data-audio="서울에 있어서 기분이 좋아요.">
    <p><strong>2.</strong> 서울에 있어서 기분이 좋아요.</p><button class="listen">🎧 Écouter</button>
    <div class="choices"><button data-choice="a">Je me sens bien parce que je suis à Séoul.</button><button data-choice="b">Je suis triste parce que je quitte Séoul.</button><button data-choice="c">Je vais bien parce que Séoul est calme.</button></div><div class="feedback"></div>
  </div>

  <div class="q" data-answer="c" data-audio="조금 피곤해요. 하지만 행복해요.">
    <p><strong>3.</strong> 조금 피곤해요. 하지만 행복해요.</p><button class="listen">🎧 Écouter</button>
    <div class="choices"><button data-choice="a">Je suis très fatiguée et triste.</button><button data-choice="b">Je suis nerveuse mais ça va.</button><button data-choice="c">Je suis un peu fatiguée, mais heureuse.</button></div><div class="feedback"></div>
  </div>

  <div class="q" data-answer="b" data-audio="걱정돼요.">
    <p><strong>4.</strong> 걱정돼요.</p><button class="listen">🎧 Écouter</button>
    <div class="choices"><button data-choice="a">Je suis enthousiaste.</button><button data-choice="b">Je suis inquiète.</button><button data-choice="c">Je suis heureuse.</button></div><div class="feedback"></div>
  </div>

  <div class="q" data-answer="a" data-audio="마음이 편해요.">
    <p><strong>5.</strong> 마음이 편해요.</p><button class="listen">🎧 Écouter</button>
    <div class="choices"><button data-choice="a">Je me sens apaisée.</button><button data-choice="b">Je suis de mauvaise humeur.</button><button data-choice="c">Je suis stressée.</button></div><div class="feedback"></div>
  </div>
</section>

<button id="nextButton" type="button" style="display:none;width:100%;">🗣️ Passer à l'oral</button>
</main>

<script src="chapter-progress.js"></script>
<script>
const LISTENING_KEY="hanaKorean_chapter36_listening";
const EXERCISE_KEY="hanaKorean_chapter36_listeningExercise";
const nextButton=document.getElementById("nextButton");

function guard(){
  if(localStorage.getItem(LISTENING_KEY)!=="completed"){
    window.location.href="ecoute-36.html";
    return false;
  }
  return true;
}
if(!guard())throw new Error("chapter36-listening-exercise-guard");

function speak(text){
  if(!("speechSynthesis" in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang="ko-KR";u.rate=.82;
  const voices=speechSynthesis.getVoices();
  const v=voices.find(x=>x.lang==="ko-KR")||voices.find(x=>x.lang&&x.lang.startsWith("ko"));
  if(v)u.voice=v;
  speechSynthesis.speak(u);
}

const qs=[...document.querySelectorAll(".q")];
qs.forEach(q=>{
  q.querySelector(".listen").addEventListener("click",()=>speak(q.dataset.audio));
  q.querySelectorAll("[data-choice]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      if(q.dataset.done==="true")return;
      const fb=q.querySelector(".feedback");
      if(btn.dataset.choice===q.dataset.answer){
        q.dataset.done="true";
        fb.textContent="✅ Très bien !";
        q.querySelectorAll("[data-choice]").forEach(b=>b.disabled=true);
        if(qs.every(x=>x.dataset.done==="true")){
          localStorage.setItem(EXERCISE_KEY,"completed");
          nextButton.style.display="block";
          if(window.HanaChapterProgress)HanaChapterProgress.render();
        }
      }else{
        btn.disabled=true;
        fb.textContent="💙 Réécoute et repère le mot d'émotion.";
      }
    });
  });
});

if(localStorage.getItem(EXERCISE_KEY)==="completed"){
  qs.forEach(q=>q.querySelectorAll("[data-choice]").forEach(b=>b.disabled=true));
  nextButton.style.display="block";
}
nextButton.addEventListener("click",()=>window.location.href="parle-36.html");
if(window.HanaChapterProgress)HanaChapterProgress.render();
</script>
</body>
</html>
