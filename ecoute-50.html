<body><main class="app"><a class="back-link" href="chapitre-50.html">← Chapitre 50</a><section id="hanaChapterPath" data-chapter-path></section>

<script src="chapter-progress.js"></script><script>
const P="hanaKorean_chapter50_understanding",K="hanaKorean_chapter50_listening";if(localStorage.getItem(P)!=="completed")location.href="chapitre-50.html";
function speak(t){if(!("speechSynthesis"in window))return;const u=new SpeechSynthesisUtterance(HanaProfile.replacePerson(t));u.lang="ko-KR";u.rate=.82;speechSynthesis.cancel();speechSynthesis.speak(u)}
document.getElementById("listen").onclick=()=>speak("하루에 몇 번 먹어요? 한 번에 몇 알 먹어요? 식사 후에 드세요. 물하고 같이 드세요. 다시 한번 천천히 말해 주세요.");
const d=document.getElementById("done"),n=document.getElementById("next");function r(){if(localStorage.getItem(K)==="completed"){d.disabled=true;n.style.display="block"}if(window.HanaChapterProgress)HanaChapterProgress.render()}d.onclick=()=>{localStorage.setItem(K,"completed");r()};n.onclick=()=>location.href="exercice-ecoute-51.html";r();
</script></body></html>
